<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
</head>
<body style="margin:0;background:#000">
<canvas id="c" width="720" height="720"></canvas>
<script>
// Cuts a square 720×720, 30 fps extract out of a source clip (see clips.json): start t0, crop centre cx/cy (0..1).
const SIZE = 720, FPS = 30, DUR = 3.5;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const b64 = (buf) => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
window.prep = async (cfg) => {
  const v = document.createElement("video"); v.muted = true; v.preload = "auto"; v.src = "/src/" + cfg.id + ".mp4";
  await new Promise((res, rej) => { v.addEventListener("loadeddata", res, { once: true }); v.addEventListener("error", () => rej(new Error("cannot load " + cfg.id)), { once: true }); });
  const s = Math.min(v.videoWidth, v.videoHeight);
  const sx = clamp(v.videoWidth * cfg.cx - s / 2, 0, v.videoWidth - s), sy = clamp(v.videoHeight * cfg.cy - s / 2, 0, v.videoHeight - s);
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: "avc", width: SIZE, height: SIZE, frameRate: FPS }, fastStart: "in-memory" });
  let error = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (error = String(e)) });
  enc.configure({ codec: "avc1.640028", width: SIZE, height: SIZE, bitrate: 9_000_000, framerate: FPS, latencyMode: "quality" });
  const N = Math.round(DUR * FPS);
  for (let k = 0; k < N; k++) {
    v.currentTime = Math.min(v.duration - 0.05, cfg.t0 + k / FPS);
    await new Promise((r) => v.addEventListener("seeked", r, { once: true }));
    ctx.drawImage(v, sx, sy, s, s, 0, 0, SIZE, SIZE);
    const frame = new VideoFrame(c, { timestamp: Math.round((k * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(frame, { keyFrame: k % 15 === 0 }); frame.close();
    while (enc.encodeQueueSize > 6) await new Promise((r) => setTimeout(r, 2));
    if (error) throw new Error(error);
  }
  await enc.flush(); muxer.finalize();
  return JSON.stringify({ id: cfg.id, frames: N, source: v.videoWidth + "x" + v.videoHeight, video: b64(muxer.target.buffer) });
};
</script>
</body>
</html>
