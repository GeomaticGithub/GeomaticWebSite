    ctx.shadowColor = "#fff"; ctx.shadowBlur = 14; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b1[0], b1[1], 4.5, 0, 6.283); ctx.fill(); }

/* ===================== 3. MAP OF MOROCCO + SIGNATURE ===================== */
const LON0 = -8.9, LAT0 = 28.55, K = 32, COS = Math.cos(LAT0 * RAD);
const flat = (lon, lat) => [(lon - LON0) * COS * K, -(lat - LAT0) * K];
let cam;
const P = (x, y, z = 0) => [cam.cx + (x * cam.c - y * cam.s) * cam.sc, cam.cy + ((x * cam.s + y * cam.c) * cam.ct - z * cam.st) * cam.sc];
const proj = ([lon, lat], z = 0) => { const [x, y] = flat(lon, lat); return P(x, y, z); };
function pathRing(ctx, ring, dy = 0) { ctx.beginPath(); ring.forEach((p, i) => { const [x, y] = proj(p); i ? ctx.lineTo(x, y + dy) : ctx.moveTo(x, y + dy); }); ctx.closePath(); }
function drawMap(ctx, t) {
  reset(ctx);
  const e = easeOut((t - S_MAP[0]) / 2.2), rz = (-17 + (t - S_MAP[0]) * 1.2) * RAD, tilt = 57 * RAD, sc = lerp(3.4, 1.3, e);
  cam = { c: Math.cos(rz), s: Math.sin(rz), ct: Math.cos(tilt), st: Math.sin(tilt), sc, cx: 0, cy: 0 };
  const [cxp, cyp] = flat(...CASA), ox = (cxp * cam.c - cyp * cam.s) * sc, oy = (cxp * cam.s + cyp * cam.c) * cam.ct * sc;
  cam.cx = lerp(360 - ox, 420, e); cam.cy = lerp(390 - oy, 430, e);
  const bg = ctx.createRadialGradient(400, 380, 60, 400, 380, 640); bg.addColorStop(0, "#0c2136"); bg.addColorStop(0.55, "#07131f"); bg.addColorStop(1, "#03080e"); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(125,170,220,0.08)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let lon = -70; lon <= 50; lon += 5) { const a = proj([lon, -10]), b = proj([lon, 65]); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
  for (let lat = -10; lat <= 65; lat += 5) { const a = proj([-70, lat]), b = proj([50, lat]); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
  ctx.stroke();
  ctx.fillStyle = "#0e1c2c"; for (const r of DATA.land) { pathRing(ctx, r); ctx.fill(); }
  ctx.strokeStyle = "rgba(125,170,220,0.10)"; for (const r of DATA.land) { pathRing(ctx, r); ctx.stroke(); }
  const ring = DATA.morocco[0], wall = 12 * cam.st * cam.sc;
  ctx.save(); ctx.shadowColor = "rgba(0,160,227,0.55)"; ctx.shadowBlur = 26; pathRing(ctx, ring, wall); ctx.fillStyle = "#081a2b"; ctx.fill(); ctx.restore();
  for (let d = wall; d > 0; d -= 1.5) { pathRing(ctx, ring, d); ctx.fillStyle = "#0a2238"; ctx.fill(); }
  pathRing(ctx, ring, wall); ctx.strokeStyle = "rgba(56,189,248,0.35)"; ctx.lineWidth = 1; ctx.stroke();
  const mg = ctx.createLinearGradient(250, 80, 480, 620); mg.addColorStop(0, "#15405f"); mg.addColorStop(1, "#0d2740"); pathRing(ctx, ring); ctx.fillStyle = mg; ctx.fill();
  ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(56,189,248,0.85)"; ctx.lineWidth = 1.6; ctx.stroke();

  ctx.save(); ctx.globalCompositeOperation = "lighter"; const ks = Math.sqrt(cam.sc / 1.3);
  PLACES.forEach((c, i) => { const [x, y] = proj([c.lon, c.lat]); if (x < -30 || y < -30 || x > W + 30 || y > H + 30) return;
    if (c.city) { const ph = (t * 0.7 + i * 0.137) % 1, rr = (c.r * 1.4 + ph * 5 * c.r) * ks; ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,214,150,${(1 - ph) * 0.6})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, rr, rr * cam.ct, 0, 0, 6.283); ctx.stroke(); }
    ctx.shadowColor = "rgba(255,190,100,0.95)"; ctx.shadowBlur = c.city ? 8 : 3; ctx.fillStyle = c.city ? "rgba(255,232,180,0.98)" : "rgba(255,206,130,0.72)";
    ctx.beginPath(); ctx.arc(x, y, c.r * 0.95 * ks, 0, 6.283); ctx.fill(); });

    const sh = ctx.createLinearGradient(0, 0, 0, 240); sh.addColorStop(0, `rgba(3,8,14,${0.75 * a})`); sh.addColorStop(1, "rgba(3,8,14,0)"); ctx.fillStyle = sh; ctx.fillRect(0, 0, W, 240);
    ctx.globalAlpha = a; ctx.drawImage(logoWhite, X - 4, 40 + (1 - a) * 8, 232, 104); ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(0,160,227,${a})`; ctx.fillRect(X, 152, 44, 3);
    font(ctx, 500, 18); ctx.textBaseline = "alphabetic"; ctx.fillStyle = `rgba(214,228,240,${a})`; ctx.fillText(TXT.tag, X, 184); }

/* ===================== timeline ===================== */
// Each shot fades in over the previous one and stays until the next one has fully faded in.
const SHOTS = [
  { c: shotB, in: S_CITY, draw: drawCity }, { c: shotD, in: S_LOS, draw: drawLOS }, { c: shotE, in: S_DOME, draw: drawDome },
  { c: shotF, in: S_DENS, draw: drawDensity }, { c: shotC, in: S_MAP, draw: drawMap },
];
function draw(ctx, t) {
  reset(ctx); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (t < S_CITY[1]) { drawGlobe(shotA.getContext("2d"), t); ctx.drawImage(shotA, 0, 0); }
  SHOTS.forEach((s, i) => { const until = SHOTS[i + 1]?.in[1] ?? S_LOOP[1]; if (t < s.in[0] || t >= until) return;
    s.draw(s.c.getContext("2d"), t); ctx.globalAlpha = ease((t - s.in[0]) / (s.in[1] - s.in[0])); ctx.drawImage(s.c, 0, 0); ctx.globalAlpha = 1; });
  if (t >= S_LOOP[0]) { drawGlobe(shotA.getContext("2d"), 0); ctx.globalAlpha = ease((t - S_LOOP[0]) / (S_LOOP[1] - S_LOOP[0])); ctx.drawImage(shotA, 0, 0); ctx.globalAlpha = 1; }
}

const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("cannot load " + src)); i.src = src; });
const b64 = (buf) => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
window.init = async () => {
  let placesRaw; [DATA, CITY, MODEL, placesRaw] = await Promise.all(["data.json", "casablanca.json", "centre3d.json", "cities.json"].map(async (f) => (await fetch(f)).json()));
  // every OSM city/town located inside the outline drawn on screen; dot size follows the population
  { const ring = DATA.morocco[0], inside = (x, y) => { let c = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) c = !c; } return c; };
    PLACES = placesRaw.cities.filter((c) => inside(c.lon, c.lat)).map((c) => ({ lon: c.lon, lat: c.lat, city: c.place === "city", r: c.place === "city" ? 1.5 + 2.7 * Math.sqrt(Math.min(1, c.pop / 3.2e6)) : 1.05 }));
    stats.places = { cities: PLACES.filter((c) => c.city).length, towns: PLACES.filter((c) => !c.city).length }; }
  await Promise.all([400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 20px Figtree`, "Aéà")));
  const [eimg, logo] = await Promise.all([loadImg("assets/earth.jpg"), loadImg("assets/logo.png")]);
  const tc = layer(TW, TH), tx = tc.getContext("2d", { willReadFrequently: true }); tx.drawImage(eimg, 0, 0, TW, TH); earth = tx.getImageData(0, 0, TW, TH).data;
  initNoise(); bakeClouds(); globeImg = new ImageData(W, H);
  for (let i = 0; i < 170; i++) stars.push([rnd() * W, rnd() * H, 0.5 + rnd() * 1.1, 0.15 + rnd() * 0.55]);
  logoWhite = layer(logo.width, logo.height); const lc = logoWhite.getContext("2d"); lc.drawImage(logo, 0, 0); lc.globalCompositeOperation = "source-in"; lc.fillStyle = "#fff"; lc.fillRect(0, 0, logo.width, logo.height);

window.still = (t) => { const c = document.getElementById("c"); draw(c.getContext("2d"), t); return c.toDataURL("image/jpeg", 0.88).split(",")[1]; };
window.render = async (bitrate) => {
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, fastStart: "in-memory" });
  let error = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (error = String(e)) });
  enc.configure({ codec: "avc1.640028", width: W, height: H, bitrate, framerate: FPS, latencyMode: "quality" });
  const N = T * FPS;
  for (let i = 0; i < N; i++) {
    draw(ctx, i / FPS);
    const frame = new VideoFrame(c, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(frame, { keyFrame: i % 60 === 0 }); frame.close();
