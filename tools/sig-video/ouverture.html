<canvas id="c" width="720" height="720"></canvas>
<script>
// Hero film — "space → country → analyses → signature", built on public-domain data only:
//   1. Earth from space (NASA Blue Marble), Morocco outlined, its cities lit up (Wikidata, CC0)
//   2. Satellite imagery: the night lights of Morocco (NASA Black Marble), raised as 3D columns of light
//   3. Network analysis: drive-time service areas from Casablanca on the national road network (Natural Earth)
//   3. Allocation: every road and city attached to the nearest regional capital (by travel time)
//   4. Proximity analysis: 50 km buffers around the cities
//   5. Population of the cities as 3D bars
//   6. Pull back to the whole country + Geomatic signature
// Base map of shots 2–6: NASA Blue Marble relief (assets/maroc-relief.jpg). Data: maroc.json (see extract-ne.mjs).
const W = 720, H = 720, FPS = 30, T = 28; // seconds, loops (cross-fades back to the first frame)

const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";

const TXT = {

const CASA = [-7.59, 33.57];
// timeline: globe rotation / dive, then [fade-in start, fade-in end] of each following shot

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

/* ===================== 1. GLOBE ===================== */

// 3D value noise (seeded) for the procedural cloud layer

const LX = 0.62, LY = 0.47, LZ = 0.63; // sun direction in view space (upper right, towards the viewer)
function globeParams(tg) {

}

/* ===================== helpers ===================== */
const reset = (ctx) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.shadowBlur = 0; ctx.setLineDash([]); ctx.lineCap = "butt"; ctx.lineJoin = "round"; ctx.filter = "none"; };

const mix = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];

// discreet caption naming the analysis (bottom-left)
function caption(ctx, text, a = 1) { if (a <= 0 || CLEAN) return; ctx.textBaseline = "alphabetic";

/* ===================== 2. 3D MAP OF MOROCCO (camera, relief base, layers) ===================== */

const REL = { w: -19, n: 38, ppd: 100 };

// the cities, as warm points of light
function drawPlaces(ctx, t, alpha = 1, pulse = false) { ctx.save(); ctx.globalCompositeOperation = "lighter"; const ks = Math.sqrt(cam.sc / 1.3);
  PLACES.forEach((c, i) => { const [x, y] = proj([c.lon, c.lat]); if (x < -30 || y < -30 || x > W + 30 || y > H + 30) return;
    if (pulse && c.city) { const ph = (t * 0.7 + i * 0.137) % 1, rr = (c.r * 1.4 + ph * 5 * c.r) * ks; ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,214,150,${(1 - ph) * 0.6 * alpha})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, rr, rr * cam.ct, 0, 0, 6.283); ctx.stroke(); }
    ctx.shadowColor = "rgba(255,190,100,0.95)"; ctx.shadowBlur = c.city ? 8 : 3; ctx.fillStyle = c.city ? `rgba(255,232,180,${0.98 * alpha})` : `rgba(255,206,130,${0.75 * alpha})`;
    ctx.beginPath(); ctx.arc(x, y, c.r * 0.95 * ks, 0, 6.283); ctx.fill(); });
  ctx.restore(); }

/* ---- shot 2: satellite imagery, the night lights of Morocco (NASA Black Marble) as columns of light ---- */
let nightL, COLS = [];
function buildLights(img) {

  const ring = DATA.morocco[0], inside = (lon, lat) => { let c2 = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if (yi > lat !== yj > lat && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) c2 = !c2; } return c2; };

    const lon = REL.w + (gx + N / 2) / REL.ppd, lat = REL.n - (gy + N / 2) / REL.ppd; if (!inside(lon, lat)) continue; const [fx, fy] = flat(lon, lat);
    COLS.push({ x: fx, y: fy, v: Math.min(1, m), d: Math.hypot(lon - CASA[0], lat - CASA[1]), j: rnd() }); }

}
function drawLights(ctx, t) {
  const k = clamp((t - S_LIGHTS[0]) / (S_NET[1] - S_LIGHTS[0])), e = ease(k * 1.35);
  setCam(lerp(CASA[0], -6.75, e), lerp(CASA[1], 33.2, e), lerp(6.6, 3.9, e), lerp(-26, -18, k), 360, lerp(360, 415, e));
  drawBase(ctx);
  // the image itself, laid on the ground
  { const [x0, y0] = flat(REL.w, REL.n); ctx.save(); camTransform(ctx); ctx.translate(x0, y0); ctx.scale((COS * K) / REL.ppd, K / REL.ppd); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.95; ctx.imageSmoothingQuality = "high"; ctx.drawImage(nightL, 0, 0); ctx.restore(); }
  // columns of light: height follows the brightness measured by the satellite
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round";
  for (const c of COLS) { const g = easeOut((t - S_LIGHTS[1] - 0.5 - c.d * 0.28 - c.j * 0.25) / 0.9); if (g <= 0) continue;
    const p0 = P(c.x, c.y, 0); if (p0[0] < -20 || p0[0] > W + 20 || p0[1] < -10 || p0[1] > H + 120) continue;
    const hgt = (1.2 + 15 * Math.pow(c.v, 1.3)) * g * (1 + 0.04 * Math.sin(t * 5 + c.j * 6.28)), p1 = P(c.x, c.y, hgt);
    const col = mix([60, 215, 190], [235, 250, 255], c.v); ctx.strokeStyle = rgba(col, 0.34 + 0.4 * c.v); ctx.lineWidth = 0.9 + cam.sc * 0.22;
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    ctx.fillStyle = rgba([255, 255, 255], 0.55 * g * c.v); ctx.fillRect(p1[0] - 0.8, p1[1] - 0.8, 1.6, 1.6); }
  ctx.restore(); finish(ctx); caption(ctx, TXT.lights, ease((t - S_LIGHTS[1] - 0.2) / 0.6));
}
/* ---- shot 3: network analysis, drive-time service areas from Casablanca ---- */
function drawNet(ctx, t) {
  const k = clamp((t - S_NET[0]) / (S_ALLOC[1] - S_NET[0])), e = ease(k * 1.5);
  setCam(lerp(-6.75, -6.7, e), lerp(33.2, 32.5, e), lerp(3.9, 2.75, e), lerp(-18, -10, k), 360, lerp(415, 410, e));
  drawBase(ctx); drawLayer(ctx, roadsL, 0.85);
  const reach = clamp((t - S_NET[1] - 0.6) / 3.1);
  if (reach > 0) { svcDrawn = updateBuckets(svcL, svcBuckets, svcDrawn, Math.floor(reach * NB) - 1, (f) => BAND[Math.min(2, Math.floor(f * 3))]); drawLayer(ctx, svcL, 0.95); }

  ctx.strokeStyle = `rgba(255,255,255,${(1 - ph) * ao})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(ox, oy, 6 + ph * 30, (6 + ph * 30) * cam.ct, 0, 0, 6.283); ctx.stroke();
  ctx.shadowColor = "#fff"; ctx.shadowBlur = 12; ctx.fillStyle = `rgba(255,255,255,${ao})`; ctx.beginPath(); ctx.arc(ox, oy, 5, 0, 6.283); ctx.fill();
  finish(ctx); caption(ctx, TXT.net, ease((t - S_NET[1] - 0.2) / 0.6));

/* ---- shot 4: allocation of the network and of the cities to the nearest regional capital ---- */
function drawAlloc(ctx, t) {
  const k = clamp((t - S_ALLOC[0]) / (S_COVER[1] - S_ALLOC[0]));
  setCam(lerp(-8.9, -9.3, k), lerp(29.9, 29.4, k), lerp(1.72, 1.56, ease(k)), lerp(-10, -2, k), 380, 400);
  drawBase(ctx); drawLayer(ctx, roadsL, 0.3);
  const g = clamp((t - S_ALLOC[1] - 0.3) / 2.4);
  if (g > 0) { allocDrawn = updateBuckets(allocL, allocBuckets, allocDrawn, Math.floor(g * NB) - 1, (f, s) => hubColor(s[5])); drawLayer(ctx, allocL, 0.95); }

  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.lineWidth = 1;
  for (const c of PLACES) { if (c.h < 0) continue; const hub = HUBS[c.h], d = Math.hypot(c.x - hub.x, c.y - hub.y) / KM, a = ease((g * 620 - d) / 60); if (a <= 0) continue;
    const p0 = P(hub.x, hub.y), p1 = P(c.x, c.y), col = hubColor(c.h); ctx.strokeStyle = rgba(col, 0.45 * a); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    ctx.fillStyle = rgba(mix(col, [255, 255, 255], 0.35), 0.95 * a); ctx.beginPath(); ctx.arc(p1[0], p1[1], c.r * 0.9, 0, 6.283); ctx.fill(); }
  const ah = ease((t - S_ALLOC[1]) / 0.5);
  HUBS.forEach((h, i) => { const [x, y] = P(h.x, h.y), col = hubColor(i), ph = (t * 0.8 + i * 0.21) % 1;
    ctx.strokeStyle = rgba(col, (1 - ph) * 0.8 * ah); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(x, y, 5 + ph * 16, (5 + ph * 16) * cam.ct, 0, 0, 6.283); ctx.stroke();
    ctx.shadowColor = rgba(col, 1); ctx.shadowBlur = 12; ctx.fillStyle = `rgba(255,255,255,${ah})`; ctx.beginPath(); ctx.arc(x, y, 4.2, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; });
  ctx.restore(); finish(ctx); caption(ctx, TXT.alloc, ease((t - S_ALLOC[1]) / 0.5));
}
/* ---- shot 5: proximity analysis, 50 km buffers around the cities (merged, clipped to the country) ---- */
const BUF_KM = 50, covL = layer();
function drawCover(ctx, t) {
  const k = clamp((t - S_COVER[0]) / (S_POP[1] - S_COVER[0]));
  setCam(lerp(-6.9, -7.3, k), lerp(32.3, 31.9, k), lerp(2.75, 2.45, ease(k)), lerp(8, 15, k), 360, 400);
  drawBase(ctx); drawLayer(ctx, roadsL, 0.4);
  const c = covL.getContext("2d"); reset(c); c.clearRect(0, 0, W, H); c.fillStyle = "#ff8a2a"; const rings = [];
  PLACES.forEach((p, i) => { const g = easeOut((t - S_COVER[1] - 0.2 - (i / PLACES.length) * 1.3) / 1.1); if (g <= 0) return;
    const [x, y] = P(p.x, p.y), r = BUF_KM * KM * cam.sc * g; if (x < -r || y < -r || x > W + r || y > H + r) return;
    c.beginPath(); c.ellipse(x, y, r, r * cam.ct, 0, 0, 6.283); c.fill(); rings.push([x, y, r, g]); });
  ctx.save(); pathRing(ctx, DATA.morocco[0]); ctx.clip(); ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.36; ctx.drawImage(covL, 0, 0); ctx.globalAlpha = 1;
  ctx.lineWidth = 1; for (const [x, y, r, g] of rings) { ctx.strokeStyle = `rgba(255,196,130,${0.5 * (1.2 - g) + 0.12})`; ctx.beginPath(); ctx.ellipse(x, y, r, r * cam.ct, 0, 0, 6.283); ctx.stroke(); }
  ctx.restore(); drawPlaces(ctx, t, 1);
  finish(ctx); caption(ctx, TXT.cover, ease((t - S_COVER[1]) / 0.5));
}
/* ---- shot 6: population of the cities, as 3D bars ---- */
const barColor = (f) => { const stops = [[30, 70, 150], [52, 190, 170], [214, 200, 255]]; const x = clamp(f) * 2, i = Math.min(1, Math.floor(x)), g = x - i; return mix(stops[i], stops[i + 1], g); };
const NORMALS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function prism(ctx, x, y, half, h, cBot, cTop, alpha) {
  if (h <= 0.2 || alpha <= 0.01) return;
  const cs = [[x - half, y - half], [x + half, y - half], [x + half, y + half], [x - half, y + half]];
  for (let i = 0; i < 4; i++) { const d = NORMALS[i][0] * cam.s + NORMALS[i][1] * cam.c; if (d <= 0.001) continue;
    const a = cs[i], b = cs[(i + 1) % 4], a0 = P(a[0], a[1], 0), b0 = P(b[0], b[1], 0), a1 = P(a[0], a[1], h), b1 = P(b[0], b[1], h), shade = 0.45 + 0.5 * d;
    const g = ctx.createLinearGradient(0, a0[1], 0, a1[1] - 0.01); g.addColorStop(0, rgba(dim(cBot, shade), alpha)); g.addColorStop(1, rgba(dim(cTop, shade), alpha));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]); ctx.lineTo(a1[0], a1[1]); ctx.closePath(); ctx.fill(); }
  ctx.beginPath(); cs.forEach((c, i) => { const p = P(c[0], c[1], h); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath();
  ctx.fillStyle = rgba(mix(cTop, [255, 255, 255], 0.4), alpha); ctx.fill();
}
function drawPop(ctx, t) {
  const k = clamp((t - S_POP[0]) / (S_MAP[1] - S_POP[0]));
  setCam(lerp(-6.6, -7.0, k), lerp(32.7, 32.9, k), lerp(3.0, 2.7, ease(k)), lerp(-20, -10, k), 360, 430);
  drawBase(ctx); drawLayer(ctx, roadsL, 0.45);
  const objs = [];
  PLACES.forEach((c, i) => { const g = easeOut((t - S_POP[1] - 0.15 - (i / PLACES.length) * 1.0) / 0.9); if (g <= 0) return;
    objs.push({ z: c.x * cam.s + c.y * cam.c, c, h: (2.5 + 62 * Math.sqrt(c.pop / 3.3e6)) * g * (1 + 0.03 * Math.sin(t * 4 + i)) }); });
  objs.sort((a, b) => a.z - b.z);
  for (const o of objs) { const v = Math.sqrt(o.c.pop / 3.3e6); prism(ctx, o.c.x, o.c.y, 1.35 + 1.5 * v, o.h, barColor(0.05), barColor(0.25 + v * 0.9), 0.9); }
  finish(ctx); caption(ctx, TXT.pop, ease((t - S_POP[1]) / 0.5));
}
/* ===================== 3. WHOLE COUNTRY + SIGNATURE ===================== */
function drawMap(ctx, t) {
  const e = easeOut((t - S_MAP[0]) / 2.2);
  setCam(lerp(-7.0, LON0, e), lerp(32.9, LAT0, e), lerp(2.7, 1.3, e), -12 + (t - S_MAP[0]) * 1.2, lerp(360, 420, e), lerp(430, 430, e));
  drawBase(ctx); drawLayer(ctx, roadsL, 0.5); drawPlaces(ctx, t, 1, true);
  const a = CLEAN ? 0 : ease((t - S_MAP[1] - 0.2) / 0.7); if (a > 0) { const X = 44; reset(ctx);
    const sh = ctx.createLinearGradient(0, 0, 0, 250); sh.addColorStop(0, `rgba(3,8,14,${0.86 * a})`); sh.addColorStop(1, "rgba(3,8,14,0)"); ctx.fillStyle = sh; ctx.fillRect(0, 0, W, 250);
    ctx.globalAlpha = a; ctx.drawImage(logoWhite, X - 4, 40 + (1 - a) * 8, 232, 104); ctx.globalAlpha = 1;
    ctx.fillStyle = `rgba(0,160,227,${a})`; ctx.fillRect(X, 152, 44, 3);
    font(ctx, 500, 18); ctx.textBaseline = "alphabetic"; ctx.fillStyle = `rgba(214,228,240,${a})`; ctx.fillText(TXT.tag, X, 184); }
  reset(ctx); const v = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 560); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.42)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

/* ===================== timeline ===================== */
// Each shot fades in over the previous one and stays until the next one has fully faded in.
const SHOTS = [
  { c: shotG, in: S_LIGHTS, draw: drawLights }, { c: shotB, in: S_NET, draw: drawNet }, { c: shotD, in: S_ALLOC, draw: drawAlloc }, { c: shotE, in: S_COVER, draw: drawCover },
  { c: shotF, in: S_POP, draw: drawPop }, { c: shotC, in: S_MAP, draw: drawMap },
];
function draw(ctx, t) {
  reset(ctx); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (t < S_LIGHTS[1]) { drawGlobe(shotA.getContext("2d"), t); ctx.drawImage(shotA, 0, 0); }
  SHOTS.forEach((s, i) => { const until = SHOTS[i + 1]?.in[1] ?? S_LOOP[1]; if (t < s.in[0] || t >= until) return;
    s.draw(s.c.getContext("2d"), t); ctx.globalAlpha = ease((t - s.in[0]) / (s.in[1] - s.in[0])); ctx.drawImage(s.c, 0, 0); ctx.globalAlpha = 1; });
  if (t >= S_LOOP[0]) { drawGlobe(shotA.getContext("2d"), 0); ctx.globalAlpha = ease((t - S_LOOP[0]) / (S_LOOP[1] - S_LOOP[0])); ctx.drawImage(shotA, 0, 0); ctx.globalAlpha = 1; }
}

const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("cannot load " + src)); i.src = src; });
const b64 = (buf) => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
window.init = async () => {
  [DATA, MA] = await Promise.all(["data.json", "maroc.json"].map(async (f) => (await fetch(f)).json()));
  // cities: dot size follows the population; "city" = 100 000 inhabitants or more
  PLACES = MA.places.map((c) => { const [x, y] = flat(c.lon, c.lat), city = c.pop >= 1e5; return { ...c, x, y, city, r: city ? 1.5 + 2.7 * Math.sqrt(Math.min(1, c.pop / 3.2e6)) : 1.05 }; });
  stats.places = { cities: PLACES.filter((c) => c.city).length, towns: PLACES.filter((c) => !c.city).length };
  await Promise.all([400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 20px Figtree`, "Aéà")));
  const [eimg, logo, rimg, nimg] = await Promise.all([loadImg("assets/earth.jpg"), loadImg("assets/logo.png"), loadImg("assets/maroc-relief.jpg"), loadImg("assets/maroc-nuit.jpg")]);
  const tc = layer(TW, TH), tx = tc.getContext("2d", { willReadFrequently: true }); tx.drawImage(eimg, 0, 0, TW, TH); earth = tx.getImageData(0, 0, TW, TH).data;
  // relief graded like the globe (cooler, darker) so the road and analysis colours stand out
  relief = layer(rimg.width, rimg.height); { const rc = relief.getContext("2d"); rc.filter = "saturate(0.7) brightness(0.74) contrast(1.18)"; rc.drawImage(rimg, 0, 0); rc.filter = "none"; rc.globalCompositeOperation = "multiply"; rc.fillStyle = "rgb(165,195,235)"; rc.fillRect(0, 0, relief.width, relief.height);

    for (const [x0, y0, x1, y1] of [[0, 0, E, 0], [w, 0, w - E, 0], [0, 0, 0, E], [0, h, 0, h - E]]) { const g = rc.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,1)"); rc.fillStyle = g; rc.fillRect(0, 0, w, h); } }
  initNoise(); bakeClouds(); globeImg = new ImageData(W, H);
  for (let i = 0; i < 170; i++) stars.push([rnd() * W, rnd() * H, 0.5 + rnd() * 1.1, 0.15 + rnd() * 0.55]);
  logoWhite = layer(logo.width, logo.height); const lc = logoWhite.getContext("2d"); lc.drawImage(logo, 0, 0); lc.globalCompositeOperation = "source-in"; lc.fillStyle = "#fff"; lc.fillRect(0, 0, logo.width, logo.height);
  stats.roads = buildRoads(); stats.lightColumns = buildLights(nimg);

};
window.still = (t) => { const c = document.getElementById("c"); draw(c.getContext("2d"), t); return c.toDataURL("image/jpeg", 0.88).split(",")[1]; };
window.render = async (bitrate) => {
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, fastStart: "in-memory" });
  let error = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (error = String(e)) });
  enc.configure({ codec: "avc1.640028", width: W, height: H, bitrate, framerate: FPS, latencyMode: "quality" });
  const N = T * FPS;
  for (let i = 0; i < N; i++) {
    draw(ctx, i / FPS);
    const frame = new VideoFrame(c, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });

};
