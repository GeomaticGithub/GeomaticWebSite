<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=block">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="720" height="720"></canvas>
<script>
const W = 720, H = 720, FPS = 30, T = 30; // seconds, seamless loop
const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";

// Each scene: [title, subtitle].
const TXT = {
  fr: {
    title: ["Le SIG", "au Maroc"], titleSub: "Comprendre le territoire par la donnée",
    scenes: {
      territories: ["Territoires", "Collectivités et foncier"],
      telecom: ["Télécoms", "Couverture et infrastructures réseau"],
      transport: ["Transport", "Réseau ferroviaire et mobilité"],
      energy: ["Énergie et mines", "Solaire, hydrocarbures et mines"],
      water: ["Eau", "Ressources et distribution"],
      analysis: ["Analyse spatiale", "Banque, finance et aide à la décision"],
    },
    outro: ["Des données", "aux décisions"], outroSub: "Geomatic · depuis 1988",
    layer: "Couche", networks: "Réseaux",
    cities: { tanger: "Tanger", fes: "Fès", laayoune: "Laâyoune" },
  },
  en: {
    title: ["GIS", "in Morocco"], titleSub: "Understanding the territory through data",
    scenes: {
      territories: ["Territories", "Local government and land registry"],
      telecom: ["Telecoms", "Coverage and network infrastructure"],
      transport: ["Transport", "Rail network and mobility"],
      energy: ["Energy and mining", "Solar, hydrocarbons and mining"],
      water: ["Water", "Resources and distribution"],
      analysis: ["Spatial analysis", "Banking, finance and decision support"],
    },
    outro: ["From data", "to decisions"], outroSub: "Geomatic · since 1988",
    layer: "Layer", networks: "Networks",
    cities: { tanger: "Tangier", fes: "Fez", laayoune: "Laayoune" },
  },
}[lang];

// Timeline (seconds). layer = 1 territories, 2 networks (one scene per sector), 3 analysis.
const SCENES = [
  { key: "territories", layer: 1, a: 3.5, b: 7.5, color: [56, 189, 248] },
  { key: "telecom", layer: 2, a: 7.5, b: 11, color: [167, 139, 250] },
  { key: "transport", layer: 2, a: 11, b: 14.5, color: [241, 245, 249], edges: [0, 1, 2, 6, 7] },
  { key: "energy", layer: 2, a: 14.5, b: 18, color: [251, 191, 36] },
  { key: "water", layer: 2, a: 18, b: 21.5, color: [34, 211, 238] },
  { key: "analysis", layer: 3, a: 21.5, b: 25.5, color: [253, 224, 71] },
];
const T_CITIES = 3.6, T_NET = 7.6, T_NET_END = 21.5, T_GRID = 21.6, T_OUTRO = [25.5, 28.9], T_FADE = 28.4, T_TITLE_BACK = 29.2;
const NEUTRAL = [125, 211, 252];

// id, lon, lat, weight (visual importance), label side
const CITIES = [
  ["tanger", -5.83, 35.77, 0.75, "r"], ["rabat", -6.84, 34.02, 0.85, "l"], ["casablanca", -7.59, 33.57, 1, "l"],
  ["fes", -5.0, 34.03, 0.75, "r"], ["oujda", -1.91, 34.68, 0.55, "b"], ["marrakech", -7.99, 31.63, 0.8, "r"],
  ["agadir", -9.6, 30.42, 0.65, "l"], ["laayoune", -13.2, 27.15, 0.5, "r"], ["dakhla", -15.93, 23.72, 0.4, "r"],
].map(([id, lon, lat, w, side]) => ({ id, lon, lat, w, side, name: TXT.cities[id] ?? id[0].toUpperCase() + id.slice(1) }));
const byId = Object.fromEntries(CITIES.map((c) => [c.id, c]));
// Stylised network links (not an actual infrastructure map)
const EDGES = [["tanger", "rabat"], ["rabat", "casablanca"], ["casablanca", "marrakech"], ["marrakech", "agadir"], ["agadir", "laayoune", -0.1],
  ["laayoune", "dakhla", -0.08], ["rabat", "fes"], ["fes", "oujda"], ["tanger", "fes"], ["fes", "marrakech"]];

// --- map plane: equirectangular centred on Morocco (flat px, origin = map centre) ---
const LON0 = -8.9, LAT0 = 28.55, K = 32, CX = 400, CY = 352, COS = Math.cos((LAT0 * Math.PI) / 180);
const flat = (lon, lat) => [(lon - LON0) * COS * K, -(lat - LAT0) * K];

const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const win = (t, a, b, f = 0.45) => ease((t - a) / f) * (1 - ease((t - (b - f)) / f)); // fade in at a, fully out at b
const cross = (t, a, b, f = 0.5) => ease((t - a) / f) * (1 - ease((t - b) / f)); // overlaps with the next scene (sum stays 1)
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mix = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const dim = (c, f) => [c[0] * f, c[1] * f, c[2] * f];
const hash = (a, b) => { const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); };
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

// --- 3D camera: the map starts flat (top view), tilts into perspective for the layers, and comes back flat for the loop ---
const TILT = 57, ROT = -17, ZOOM = 0.34; // degrees, degrees, extra zoom when tilted
let cam;
function setCam(t) {
  const k = ease((t - 2.8) / 1.7) * (1 - ease((t - 28.1) / 1.5));
  const tilt = (TILT * Math.PI / 180) * k, rz = ((ROT + Math.sin((t / T) * 6.283) * 2.5) * Math.PI / 180) * k; // slow orbit drift
  cam = { k, c: Math.cos(rz), s: Math.sin(rz), ct: Math.cos(tilt), st: Math.sin(tilt), sc: 1 + ZOOM * k, cx: CX + 6 * k, cy: CY + 62 * k };
}
const P = (x, y, z = 0) => [cam.cx + (x * cam.c - y * cam.s) * cam.sc, cam.cy + ((x * cam.s + y * cam.c) * cam.ct - z * cam.st) * cam.sc];
const depthOf = (x, y) => x * cam.s + y * cam.c; // larger = closer to the viewer
const proj = ([lon, lat], z = 0) => { const [x, y] = flat(lon, lat); return P(x, y, z); };

let DATA, grid = [], stars = [];
function pointInRing(x, y, ring) { let inside = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside; } return inside; }

function setup() {
  const ring = DATA.morocco[0];
  // analysis grid: points inside the country, value = influence of nearby cities (illustrative, not real statistics)
  const step = 0.42;
  for (let lat = 20.9; lat < 36; lat += step) for (let lon = -17.2 + ((Math.round(lat / step) % 2) * step) / 2; lon < -0.9; lon += step) {
    if (!pointInRing(lon, lat, ring)) continue;
    let v = 0;
    for (const c of CITIES) { const d = Math.hypot((lon - c.lon) * COS, lat - c.lat); v += c.w * Math.exp(-(d * d) / 1.6); }
    const dc = Math.hypot((lon - byId.casablanca.lon) * COS, lat - byId.casablanca.lat);
    const [x, y] = flat(lon, lat);
    grid.push({ x, y, v: clamp(v / 1.35), dc, j: rnd() });
  }
  CITIES.forEach((c, i) => { [c.x, c.y] = flat(c.lon, c.lat); c.i = i; });
  for (let i = 0; i < 90; i++) stars.push([rnd() * W, rnd() * H, 0.4 + rnd() * 0.9, rnd() * 6.28]);
}

// bar colours inspired by the original Esri hero video: deep blue base, green body, lavender tops
const barColor = (f) => { const stops = [[24, 52, 128], [52, 168, 138], [196, 181, 255]]; const x = clamp(f) * 2, i = Math.min(1, Math.floor(x)), g = x - i; return mix(stops[i], stops[i + 1], g); };
function pathRing(ctx, ring, dy = 0) { ctx.beginPath(); ring.forEach((p, i) => { const [x, y] = proj(p); i ? ctx.lineTo(x, y + dy) : ctx.moveTo(x, y + dy); }); ctx.closePath(); }
function font(ctx, w, s) { ctx.font = `${w} ${s}px Figtree, "Segoe UI", sans-serif`; }
function wrapLines(ctx, text, maxW) { const out = []; let line = ""; for (const w of text.split(" ")) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test; } out.push(line); return out; }
function wrap(ctx, text, x, y, maxW, lh) { wrapLines(ctx, text, maxW).forEach((l, i) => ctx.fillText(l, x, y + i * lh)); }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// Extruded square column standing on the map plane (flat coords x,y; half-width; height h in px)
const NORMALS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function prism(ctx, x, y, half, h, cBot, cTop, alpha) {
  if (h <= 0.4 || alpha <= 0.01) return;
  const cs = [[x - half, y - half], [x + half, y - half], [x + half, y + half], [x - half, y + half]];
  for (let i = 0; i < 4; i++) {
    const d = NORMALS[i][0] * cam.s + NORMALS[i][1] * cam.c; if (d <= 0.001) continue; // only faces turned to the viewer
    const a = cs[i], b = cs[(i + 1) % 4], a0 = P(a[0], a[1], 0), b0 = P(b[0], b[1], 0), a1 = P(a[0], a[1], h), b1 = P(b[0], b[1], h);
    const shade = 0.42 + 0.5 * d;
    const g = ctx.createLinearGradient(0, a0[1], 0, a1[1] - 0.01); g.addColorStop(0, rgba(dim(cBot, shade), alpha)); g.addColorStop(1, rgba(dim(cTop, shade), alpha));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]); ctx.lineTo(a1[0], a1[1]); ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); cs.forEach((c, i) => { const p = P(c[0], c[1], h); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.closePath();
  ctx.fillStyle = rgba(mix(cTop, [255, 255, 255], 0.35), alpha); ctx.fill();
}

function draw(ctx, t) {
  setCam(t);
  const F = 1 - ease((t - T_FADE) / 1.2); // everything added during the film fades out before the loop point
  // background
  const g = ctx.createRadialGradient(CX, CY - 40, 60, CX, CY, 620); g.addColorStop(0, "#0c2136"); g.addColorStop(0.55, "#07131f"); g.addColorStop(1, "#03080e");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const [x, y, r, ph] of stars) { ctx.fillStyle = `rgba(148,197,255,${0.10 + 0.10 * Math.sin(ph + (t / T) * 6.283 * 3)})`; ctx.fillRect(x, y, r, r); }
  // graticule every 5° (on the map plane)
  ctx.strokeStyle = "rgba(125,170,220,0.08)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let lon = -70; lon <= 50; lon += 5) { const a = proj([lon, -10]), b = proj([lon, 65]); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
  for (let lat = -10; lat <= 65; lat += 5) { const a = proj([-70, lat]), b = proj([50, lat]); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
  ctx.stroke();
  // surrounding land (no borders)
  ctx.fillStyle = "#0e1c2c"; for (const r of DATA.land) { pathRing(ctx, r); ctx.fill(); }
  ctx.strokeStyle = "rgba(125,170,220,0.10)"; ctx.lineWidth = 1; for (const r of DATA.land) { pathRing(ctx, r); ctx.stroke(); }

  // Morocco as a raised slab: side wall, glow, top face, outline
  const ring = DATA.morocco[0];
  const wall = 12 * cam.st * cam.sc;
  ctx.save(); ctx.shadowColor = "rgba(0,160,227,0.55)"; ctx.shadowBlur = 26; pathRing(ctx, ring, wall); ctx.fillStyle = "#081a2b"; ctx.fill(); ctx.restore();
  for (let d = wall; d > 0; d -= 1.5) { pathRing(ctx, ring, d); ctx.fillStyle = "#0a2238"; ctx.fill(); }
  if (wall > 1) { pathRing(ctx, ring, wall); ctx.strokeStyle = "rgba(56,189,248,0.35)"; ctx.lineWidth = 1; ctx.stroke(); }
  const mg = ctx.createLinearGradient(250, 80, 480, 620); mg.addColorStop(0, "#15405f"); mg.addColorStop(1, "#0d2740");
  pathRing(ctx, ring); ctx.fillStyle = mg; ctx.fill();
  ctx.lineJoin = "round"; ctx.strokeStyle = "rgba(56,189,248,0.85)"; ctx.lineWidth = 1.6; ctx.stroke();
  // light travelling along the border (3 full turns per loop → seamless)
  let perimeter = 0; { let prev = null; for (const p of ring) { const q = proj(p); if (prev) perimeter += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q; } }
  ctx.save(); ctx.setLineDash([70, perimeter - 70]); ctx.lineDashOffset = -((t / T) * 3 * perimeter); ctx.strokeStyle = "rgba(224,247,255,0.95)"; ctx.lineWidth = 2.4;
  ctx.shadowColor = "#38bdf8"; ctx.shadowBlur = 12; pathRing(ctx, ring); ctx.stroke(); ctx.restore();

  // ---- scene weights ----
  const sectors = SCENES.filter((s) => s.layer === 2);
  const weights = sectors.map((s) => cross(t, s.a, s.b));
  const wTerr = cross(t, SCENES[0].a, SCENES[0].b);
  const wAn = ease((t - T_NET_END) / 0.6); // analysis look stays until the final fade

  // city columns: height and colour follow the scene on screen
  const cityH = CITIES.map((c) => {
    const appear = easeOut((t - T_CITIES - c.i * 0.16) / 0.7);
    let h = wTerr * (18 + 54 * c.w) + wAn * 9;
    sectors.forEach((s, si) => { h += weights[si] * (22 + 54 * hash(si + 1, c.i + 1)); });
    return h * appear * F * cam.k;
  });
  const cityColor = () => { let col = dim([56, 189, 248], wTerr); sectors.forEach((s, si) => { col = [col[0] + s.color[0] * weights[si], col[1] + s.color[1] * weights[si], col[2] + s.color[2] * weights[si]]; });
    const an = [125, 211, 252]; return [col[0] + an[0] * wAn, col[1] + an[1] * wAn, col[2] + an[2] * wAn].map((v) => Math.min(255, v)); };
  const colCity = cityColor();

  // ---- layer 2: ground networks, restyled for each sector ----
  const edgeGeom = (i) => { const [a, b, bend = 0.12] = EDGES[i]; const A = byId[a], B = byId[b];
    const len = Math.hypot(B.x - A.x, B.y - A.y), ux = -(B.y - A.y) / len, uy = (B.x - A.x) / len;
    const qx = (A.x + B.x) / 2 - (B.y - A.y) * bend, qy = (A.y + B.y) / 2 + (B.x - A.x) * bend;
    const g2 = (u, wave = 0) => { const o = wave ? Math.sin(u * len * 0.22 - t * 5) * wave * Math.sin(u * 3.1416) : 0;
      return [(1 - u) * (1 - u) * A.x + 2 * (1 - u) * u * qx + u * u * B.x + ux * o, (1 - u) * (1 - u) * A.y + 2 * (1 - u) * u * qy + u * u * B.y + uy * o]; };
    return { A, B, len, g2 }; };
  const neutralW = wAn;
  const train = []; // moving 3D wagons, drawn with the columns (depth-sorted)
  if (t > T_NET - 0.2 && F > 0) {
    EDGES.forEach((e, i) => {
      const k = easeOut((t - T_NET - i * 0.2) / 0.9); if (k <= 0) return;
      const { A, B, len, g2 } = edgeGeom(i);
      const line = (wave = 0, n = 40, zf = null) => { ctx.beginPath(); for (let s = 0; s <= n; s++) { const u = (s / n) * k; const [x, y] = g2(u, wave); const [px, py] = P(x, y, zf ? zf(u) : 0); s ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } };
      const packet = (color, alpha, speed, size, off = 0, zf = null) => { if (k < 1 || alpha <= 0.01) return; const u = (t * speed + i * 0.137 + off) % 1; const [x, y] = g2(u); const [px, py] = P(x, y, zf ? zf(u) : 0);
        ctx.save(); ctx.shadowColor = rgba(color, 1); ctx.shadowBlur = 10; ctx.fillStyle = rgba([255, 255, 255], 0.95 * alpha * Math.sin(u * 3.1416));
        ctx.beginPath(); ctx.arc(px, py, size, 0, 6.283); ctx.fill(); ctx.restore(); };

      if (neutralW > 0.01) { line(); ctx.strokeStyle = rgba(NEUTRAL, 0.55 * neutralW * F); ctx.lineWidth = 1.5; ctx.stroke(); packet(NEUTRAL, neutralW * F, 0.45, 2.4); }
      sectors.forEach((s, si) => {
        const w = weights[si] * F; if (w <= 0.01) return;
        const active = !s.edges || s.edges.includes(i);
        if (!active) { line(); ctx.strokeStyle = rgba(NEUTRAL, 0.18 * w); ctx.lineWidth = 1.2; ctx.stroke(); return; }
        ctx.save(); ctx.lineCap = "round";
        if (s.key === "telecom") { // faint ground trace; the radio links themselves are drawn as arcs in the air (below)
          line(); ctx.strokeStyle = rgba(s.color, 0.22 * w); ctx.lineWidth = 1.2; ctx.stroke();
        } else if (s.key === "transport") { // rail: dark bed + bright line + sleepers, with 3D wagons
          line(); ctx.strokeStyle = rgba([4, 12, 20], 0.7 * w); ctx.lineWidth = 6; ctx.stroke();
          line(); ctx.strokeStyle = rgba(s.color, 0.95 * w); ctx.lineWidth = 2.4; ctx.stroke();
          line(); ctx.setLineDash([1.5, 9]); ctx.strokeStyle = rgba(s.color, 0.55 * w); ctx.lineWidth = 7; ctx.lineCap = "butt"; ctx.stroke();
          if (k >= 1) for (let n = 0; n < 3; n++) { const u = (t * 0.3 + i * 0.137 + n * 0.035) % 1; const [x, y] = g2(u); train.push({ x, y, half: 3.2, h: 7, bot: dim(s.color, 0.5), top: s.color, a: w * Math.sin(u * 3.1416) }); }
        } else if (s.key === "energy") { // glowing power lines
          ctx.shadowColor = rgba(s.color, 0.9 * w); ctx.shadowBlur = 12; line(); ctx.strokeStyle = rgba(s.color, 0.95 * w); ctx.lineWidth = 2; ctx.stroke();
        } else { // water: flowing wavy lines
          line(3.2, 60); ctx.strokeStyle = rgba(s.color, 0.95 * w); ctx.lineWidth = 2.2; ctx.stroke();
        }
        ctx.restore();
        if (s.key === "energy" || s.key === "water") { const speed = s.key === "energy" ? 0.7 : 0.5; packet(s.color, w, speed, 2.6); packet(s.color, w, speed, 2.2, 0.5); }
      });
    });
  }

  // ---- 3D objects, painted back to front: analysis bars, city columns, wagons ----
  const objs = [];
  if (t > T_GRID - 0.2 && F > 0) for (const d of grid) {
    const k = easeOut((t - T_GRID - d.dc * 0.11 - d.j * 0.3) / 0.9); if (k <= 0) continue;
    const breathe = 1 + 0.06 * Math.sin((t / T) * 6.283 * 9 + d.j * 6.28);
    const h = (5 + 92 * d.v * d.v + 14 * d.v) * k * breathe * F * cam.k;
    objs.push({ z: depthOf(d.x, d.y), draw: () => prism(ctx, d.x, d.y, 3.4, h, barColor(0), barColor(0.25 + d.v * 0.85), (0.55 + 0.45 * d.v) * F) });
  }
  CITIES.forEach((c) => { const h = cityH[c.i]; if (h <= 0.4) return;
    objs.push({ z: depthOf(c.x, c.y) + 0.01, draw: () => {
      prism(ctx, c.x, c.y, 4.6 + c.w * 1.6, h, dim(colCity, 0.28), colCity, 0.96 * F);
      const [tx, ty] = P(c.x, c.y, h); const gl = ctx.createRadialGradient(tx, ty, 1, tx, ty, 20); gl.addColorStop(0, rgba(colCity, 0.5 * F)); gl.addColorStop(1, rgba(colCity, 0));
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(tx, ty, 20, 0, 6.283); ctx.fill();
    } }); });
  for (const w of train) objs.push({ z: depthOf(w.x, w.y) + 0.02, draw: () => prism(ctx, w.x, w.y, w.half, w.h, w.bot, w.top, w.a) });
  objs.sort((a, b) => a.z - b.z).forEach((o) => o.draw());

  // ---- telecom: radio links as arcs in the air between column tops, and signal rings ----
  const wt = weights[0] * F;
  if (wt > 0.01 && t > T_NET - 0.2) {
    const col = sectors[0].color;
    EDGES.forEach((e, i) => {
      const k = easeOut((t - T_NET - i * 0.2) / 0.9); if (k <= 0) return;
      const { A, B, len, g2 } = edgeGeom(i);
      const zf = (u) => cityH[A.i] * (1 - u) + cityH[B.i] * u + 4 * Math.min(64, len * 0.42) * u * (1 - u) * cam.k;
      ctx.save(); ctx.lineCap = "round"; ctx.setLineDash([2, 7]); ctx.lineDashOffset = -t * 14; ctx.shadowColor = rgba(col, 0.8 * wt); ctx.shadowBlur = 8;
      ctx.beginPath(); for (let s = 0; s <= 40; s++) { const u = (s / 40) * k; const [x, y] = g2(u); const [px, py] = P(x, y, zf(u)); s ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.strokeStyle = rgba(col, 0.95 * wt); ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore();
      if (k >= 1) for (const off of [0, 0.5]) { const u = (t * 0.9 + i * 0.137 + off) % 1; const [x, y] = g2(u); const [px, py] = P(x, y, zf(u));
        ctx.save(); ctx.shadowColor = rgba(col, 1); ctx.shadowBlur = 10; ctx.fillStyle = `rgba(255,255,255,${0.95 * wt * Math.sin(u * 3.1416)})`; ctx.beginPath(); ctx.arc(px, py, 2.5, 0, 6.283); ctx.fill(); ctx.restore(); }
    });
    CITIES.forEach((c) => { for (let r = 0; r < 3; r++) { const ph = (t * 0.6 + c.i * 0.17 + r / 3) % 1, rad = 7 + ph * 24;
      ctx.beginPath(); for (let a = 0; a <= 32; a++) { const an = (a / 32) * 6.283; const [px, py] = P(c.x + Math.cos(an) * rad, c.y + Math.sin(an) * rad, cityH[c.i]); a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.strokeStyle = rgba(col, (1 - ph) * 0.7 * wt); ctx.lineWidth = 1.5; ctx.stroke(); } });
  }

  // ---- layer 1: city markers and labels ----
  if (t > T_CITIES - 0.2 && F > 0) for (const pass of ["marker", "label"]) {
    CITIES.forEach((c) => {
      const k = easeOut((t - T_CITIES - c.i * 0.16) / 0.6); if (k <= 0) return;
      const [x, y] = P(c.x, c.y, 0), [tx, ty] = P(c.x, c.y, cityH[c.i]); const R = 3 + c.w * 3;
      if (pass === "marker") {
      // pulse on the ground (an ellipse once the map is tilted)
      const ph = ((t * 0.5 + c.i * 0.21) % 1), rr = (R + ph * 16 * c.w + 2) * cam.sc;
      ctx.strokeStyle = `rgba(56,189,248,${(1 - ph) * 0.6 * F * k})`; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.ellipse(x, y, rr, rr * cam.ct, 0, 0, 6.283); ctx.stroke();
      // bright cap on top of the column
      ctx.save(); ctx.shadowColor = "#38bdf8"; ctx.shadowBlur = 12; ctx.fillStyle = `rgba(255,255,255,${F * k})`;
      ctx.beginPath(); ctx.arc(tx, ty, R * k, 0, 6.283); ctx.fill(); ctx.restore();
      ctx.fillStyle = `rgba(0,121,193,${F * k})`; ctx.beginPath(); ctx.arc(tx, ty, R * 0.45 * k, 0, 6.283); ctx.fill();
      return; }
      // label next to the base, with a dark halo
      font(ctx, 600, 15); ctx.textBaseline = "middle";
      const tw = ctx.measureText(c.name).width, gap = (7 + c.w * 2) * cam.sc + 6; let lx = x + gap, ly = y + 2;
      if (c.side === "l") lx = x - gap - tw; if (c.side === "b") { lx = x - tw / 2; ly = y + 16; }
      ctx.lineWidth = 3.5; ctx.strokeStyle = `rgba(4,12,20,${0.9 * F * k})`; ctx.strokeText(c.name, lx, ly);
      ctx.fillStyle = `rgba(226,240,252,${F * k})`; ctx.fillText(c.name, lx, ly);
    });
  }

  // ---- captions (top-left) ----
  const X = 40; ctx.textBaseline = "alphabetic";
  const sh = ctx.createLinearGradient(0, 0, 0, 250); sh.addColorStop(0, "rgba(3,8,14,0.8)"); sh.addColorStop(0.7, "rgba(3,8,14,0.45)"); sh.addColorStop(1, "rgba(3,8,14,0)");
  ctx.fillStyle = sh; ctx.fillRect(0, 0, W, 250 * (0.55 + 0.45 * cam.k));
  const bigTitle = (lines, sub, a) => { if (a <= 0) return;
    ctx.fillStyle = `rgba(0,160,227,${a})`; ctx.fillRect(X, 46, 44, 4);
    font(ctx, 800, 46); ctx.fillStyle = `rgba(255,255,255,${a})`; lines.forEach((l, i) => ctx.fillText(l, X, 104 + i * 50));
    font(ctx, 500, 19); ctx.fillStyle = `rgba(200,220,238,${a})`; wrap(ctx, sub, X, 104 + lines.length * 50 - 10, 270, 25); };
  // base title: visible at t=0 and again at t=T (loop point)
  bigTitle(TXT.title, TXT.titleSub, 1 - ease((t - 2.6) / 0.6) + ease((t - T_TITLE_BACK) / 0.7));
  SCENES.forEach((s) => { const a = win(t, s.a, s.b); if (a <= 0) return;
    const [title, sub] = TXT.scenes[s.key];
    const accent = s.layer === 2 ? s.color : [56, 189, 248];
    font(ctx, 700, 15); ctx.fillStyle = rgba(accent, a);
    ctx.fillText(`${TXT.layer.toUpperCase()} 0${s.layer} / 03${s.layer === 2 ? "  ·  " + TXT.networks.toUpperCase() : ""}`, X, 58);
    for (let k = 0; k < 3; k++) { ctx.fillStyle = k < s.layer ? rgba(accent, a) : `rgba(148,163,184,${0.35 * a})`; ctx.fillRect(X + k * 30, 70, 24, 3); }
    font(ctx, 800, 38); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText(title, X, 124);
    font(ctx, 500, 19); ctx.fillStyle = `rgba(200,220,238,${a})`; wrap(ctx, sub, X, 156, 300, 25);

  });
  bigTitle(TXT.outro, TXT.outroSub, win(t, T_OUTRO[0], T_OUTRO[1]));

  // soft vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 560); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

const b64 = (buf) => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

window.init = async () => {
  DATA = await (await fetch("data.json")).json();
  await Promise.all([400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 20px Figtree`, "Aéà")));
  setup(); return { grid: grid.length, fonts: document.fonts.check("700 20px Figtree"), muxer: typeof Mp4Muxer, seconds: T };
};
window.still = (t) => { const c = document.getElementById("c"); draw(c.getContext("2d"), t); return c.toDataURL("image/jpeg", 0.86).split(",")[1]; };
window.render = async (bitrate) => {
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: "avc", width: W, height: H, frameRate: FPS }, fastStart: "in-memory" });
  let error = null;
  const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: (e) => (error = String(e)) });
  enc.configure({ codec: "avc1.640028", width: W, height: H, bitrate, framerate: FPS, latencyMode: "quality" });
  const N = T * FPS;
  for (let i = 0; i < N; i++) {
    draw(ctx, i / FPS);
    const frame = new VideoFrame(c, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(frame, { keyFrame: i % 60 === 0 }); frame.close();
    while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 2));
    if (error) throw new Error(error);
  }
  await enc.flush(); muxer.finalize();
  return JSON.stringify({ frames: N, video: b64(muxer.target.buffer) });
};
